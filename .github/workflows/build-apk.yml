name: Zbuduj podpisane APK Blisko

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Ustaw Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sprawdź sekrety
        env:
          KEYSTORE_BASE64: ${{ secrets.BLISKO_KEYSTORE_BASE64 }}
          RAW_PASSWORD: ${{ secrets.BLISKO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$RAW_PASSWORD" ]; then
            echo "Brakuje BLISKO_KEYSTORE_BASE64 lub BLISKO_KEYSTORE_PASSWORD."
            exit 1
          fi

          python - <<'PY'
          import os
          raw = os.environ["RAW_PASSWORD"]
          clean = raw.strip()

          if not clean:
              raise SystemExit("Hasło po usunięciu białych znaków jest puste.")

          if not clean.isascii():
              raise SystemExit("BLISKO_KEYSTORE_PASSWORD zawiera znak spoza ASCII. Wklej ponownie zawartość pliku TXT.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("BLISKO_CLEAN_PASSWORD=" + clean + "\n")

          print("Hasło wygląda poprawnie (bez ujawniania jego wartości).")
          PY

      - name: Ustaw numer wersji
        run: |
          echo "BUILD_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Zainstaluj zależności
        run: npm install

      - name: Wygeneruj projekt Android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Wymuś build bez podpisu Gradle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # Odcinamy zarówno stary plugin Blisko, jak i domyślny podpis debug.
          s = s.replace("signingConfig signingConfigs.bliskoRelease", "")
          s = s.replace("signingConfig signingConfigs.debug", "")

          p.write_text(s, encoding="utf-8")
          print("Gradle release będzie budowany bez podpisu.")
          PY

      - name: Odtwórz i sprawdź klucz
        env:
          KEYSTORE_BASE64: ${{ secrets.BLISKO_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > blisko-release.jks

          keytool -list \
            -keystore blisko-release.jks \
            -storepass "$BLISKO_CLEAN_PASSWORD" \
            -alias blisko >/dev/null

          echo "Klucz i hasło są poprawne."

      - name: Zbuduj release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Podpisz gotowe APK
        shell: bash
        run: |
          set -e

          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'app-release.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi

          if [ -z "$APK" ]; then
            echo "Nie znaleziono APK do podpisania."
            exit 1
          fi

          echo "Znaleziono APK: $APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$ZIPALIGN" -f 4 "$APK" /tmp/blisko-aligned.apk

          "$APKSIGNER" sign \
            --ks blisko-release.jks \
            --ks-key-alias blisko \
            --ks-pass "pass:$BLISKO_CLEAN_PASSWORD" \
            --key-pass "pass:$BLISKO_CLEAN_PASSWORD" \
            --out android/app/build/outputs/apk/release/app-release.apk \
            /tmp/blisko-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

          echo "APK podpisane i zweryfikowane."

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Blisko-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
